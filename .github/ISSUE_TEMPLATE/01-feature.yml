name: Feature
description: 새로운 기능이나 기존 기능의 개선을 제안해요.
title: "[Feat] "
body:
  - type: textarea
    id: purpose
    attributes:
      label: 어떤 기능인가요?
      description: 필요한 기능과 해결하려는 문제를 적어주세요.
      placeholder: 누가, 어떤 상황에서, 무엇을 할 수 있어야 하나요?
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 구현할 내용을 체크리스트로 적어주세요. 아직 정해지지 않았다면 생략해도 좋아요.
      placeholder: |
        - [ ] 화면 구현
        - [ ] 데이터 연결
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 어떤 동작을 확인하면 이 작업이 완료된 건가요?
      placeholder: 사용자가 버튼을 누르면 선택한 내용이 저장되고, 앱을 다시 실행해도 유지된다.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 Figma, 문서, 이슈 링크나 스크린샷을 첨부해주세요. (선택)
