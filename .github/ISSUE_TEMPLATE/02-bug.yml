name: Bug
description: 예상과 다르게 동작하는 문제를 공유해요.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제가 발생했나요?
      description: 실제 동작과 기대한 동작을 함께 적어주세요.
      placeholder: |
        실제 동작:
        기대한 동작:
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제가 발생한 순서를 적어주세요. 재현이 어렵다면 발생 당시 상황을 알려주세요.
      placeholder: |
        1. 앱에서 ... 화면으로 이동한다.
        2. ... 버튼을 누른다.
        3. ... 문제가 발생한다.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 확인 가능한 정보만 적어주세요. (선택)
      placeholder: |
        - 기기 / 시뮬레이터:
        - iOS 버전:
        - 앱 버전 / 빌드 번호 / 커밋:
  - type: textarea
    id: attachments
    attributes:
      label: 스크린샷 및 로그
      description: 문제 파악에 도움이 되는 스크린샷, 영상, 로그를 첨부해주세요. (선택)
